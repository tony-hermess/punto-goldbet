          to   { opacity: 1; transform: translateY(0); }
        }
        .screen-fwd { animation: slideIn 0.28s cubic-bezier(0.22, 0.8, 0.3, 1) both; }

        .stagger > *:nth-child(2) { animation-delay: 0.10s; }

        .stagger > *:nth-child(5) { animation-delay: 0.28s; }

        .crumb { animation: crumbIn 0.25s ease both; }

          transition: transform 0.18s ease, opacity 0.18s ease;
          opacity: 0.5;
          font-size: 20px;
          line-height: 1;

        .opt-btn:hover .chev { transform: translateX(3px); opacity: 1; }
